services:
  postgres:
    image: postgres:15-alpine
    container_name: pinoytax_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pinoytax
      POSTGRES_PASSWORD: pinoytax_dev_password
      POSTGRES_DB: pinoytax_ai
    ports:
      - "5432:5432"
    volumes:
      - pinoytax_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pinoytax"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pinoytax_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: pinoytax_rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: pinoytax
      RABBITMQ_DEFAULT_PASS: pinoytax_dev_password

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: pinoytax_api
    restart: unless-stopped
    # Pins this container to api-only. The image's default CMD (unset here
    # would otherwise apply) runs api+worker combined via supervisord —
    # that mode exists for Render's Free plan (no standalone Background
    # Worker service type there), not for local dev, where the separate
    # `worker` service below already covers the worker process. Without
    # this override, running `docker-compose up` would process every
    # background job twice (once from this container, once from `worker`).
    command: ["node", "dist/main.js"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    env_file:
      - ./apps/api/.env
    environment:
      # Overrides for in-network hostnames — .env's defaults point at
      # localhost for running the API outside Docker; inside the compose
      # network, services reach each other by service name.
      DATABASE_URL: postgresql://pinoytax:pinoytax_dev_password@postgres:5432/pinoytax_ai?schema=public
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://pinoytax:pinoytax_dev_password@rabbitmq:5672
    ports:
      - "3001:3001"

  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: pinoytax_worker
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    env_file:
      - ./apps/api/.env
    environment:
      DATABASE_URL: postgresql://pinoytax:pinoytax_dev_password@postgres:5432/pinoytax_ai?schema=public
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://pinoytax:pinoytax_dev_password@rabbitmq:5672
      # The worker never listens on HTTP — see Dockerfile's HEALTHCHECK
      # comment. Without this, `docker ps` reports it "unhealthy" forever
      # despite running correctly.
      WORKER_PROCESS: "true"

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        # Baked into the client bundle at build time — browsers on the host
        # reach the API via its published port, not the in-network service name.
        NEXT_PUBLIC_API_URL: http://localhost:3001/v1
    container_name: pinoytax_web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  pinoytax_pg_data:
