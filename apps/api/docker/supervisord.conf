# Runs the api HTTP server and the worker background processor as two
# supervised child processes in one container, for Render's Free plan
# (which has no Background Worker service type — only Web Service,
# Static Site, Postgres, and Key Value support Free instances). This file
# is only used by the combined-mode CMD in ../Dockerfile; Railway's
# existing services and local docker-compose both override the container
# command directly and never load this config — see Dockerfile comments.
#
# Deliberately NOT `node dist/worker.js & node dist/main.js`: a bare `&`
# backgrounds the worker with no supervision — a crashed worker silently
# stays dead, and neither process's exit is monitored or restarted, so a
# single unhandled worker exception quietly stops all background job
# processing while the container reports healthy indefinitely. supervisord
# gives each process independent autorestart, proper SIGTERM propagation
# on container stop (see stopsignal/stopwaitsecs below), and zombie
# reaping — the actual guarantees graceful shutdown needs.
[supervisord]
nodaemon=true
logfile=/app/run/supervisord.log
logfile_maxbytes=0
pidfile=/app/run/supervisord.pid

; The api process owns the HTTP port Render's health check and proxy hit.
; A worker crash must never take the api down with it — autorestart is
; scoped per-program, not global, so they fail independently.
[program:api]
command=node dist/main.js
directory=/app
priority=1
autostart=true
autorestart=true
startsecs=3
startretries=3
stopsignal=TERM
stopwaitsecs=25
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:worker]
command=node dist/worker.js
directory=/app
priority=2
autostart=true
autorestart=true
startsecs=3
startretries=3
stopsignal=TERM
stopwaitsecs=25
stopasgroup=true
killasgroup=true
environment=WORKER_PROCESS="true"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
