name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (build, lint, test, migrations)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: pinoytax
          POSTGRES_PASSWORD: pinoytax_ci_password
          POSTGRES_DB: pinoytax_ai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pinoytax"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://pinoytax:pinoytax_ci_password@localhost:5432/pinoytax_ai
      JWT_ACCESS_SECRET: ci_test_access_secret_not_for_production
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      JWT_REFRESH_EXPIRES_IN_REMEMBER_ME: 30d
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate --schema=apps/api/prisma/schema.prisma

      - name: Apply migrations to a disposable database
        run: npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma

      - name: Build
        run: npm run build --workspace=apps/api

      - name: Lint
        working-directory: apps/api
        run: npx eslint "{src,test}/**/*.ts" --max-warnings=0

      - name: Unit tests
        run: npm test --workspace=apps/api

  web:
    name: Web (build, lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build --workspace=apps/web

      - name: Lint
        working-directory: apps/web
        run: npx next lint --max-warnings=0

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: pinoytax
          POSTGRES_PASSWORD: pinoytax_ci_password
          POSTGRES_DB: pinoytax_ai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pinoytax"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: production
      DATABASE_URL: postgresql://pinoytax:pinoytax_ci_password@localhost:5432/pinoytax_ai
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci_test_access_secret_not_for_production
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      JWT_REFRESH_EXPIRES_IN_REMEMBER_ME: 30d
      APP_WEB_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:3001/v1
      # RabbitMQ is best-effort (domain-event fan-out only — see
      # rabbitmq.service.ts's onModuleInit, which catches and logs a
      # connection failure rather than blocking boot), so the API runs fine
      # in this job without a RabbitMQ service container.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Generate Prisma Client
        run: npx prisma generate --schema=apps/api/prisma/schema.prisma

      - name: Apply migrations
        run: npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma

      - name: Seed roles, permissions, and tax rules
        run: npm run prisma:seed --workspace=apps/api

      - name: Build API
        run: npm run build --workspace=apps/api

      - name: Build web
        run: npm run build --workspace=apps/web

      - name: Start API in the background
        run: nohup node apps/api/dist/src/main.js > api.log 2>&1 &

      - name: Wait for API to be healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/health > /dev/null; then echo "API is up"; exit 0; fi
            sleep 2
          done
          echo "API did not become healthy in time"; cat api.log; exit 1

      - name: Start web in the background
        run: nohup npm run start --workspace=apps/web > web.log 2>&1 &

      - name: Wait for web to respond
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000 > /dev/null; then echo "Web is up"; exit 0; fi
            sleep 2
          done
          echo "Web did not become healthy in time"; cat web.log; exit 1

      - name: Run Playwright suite
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload server logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs
          path: |
            api.log
            web.log
          retention-days: 14
